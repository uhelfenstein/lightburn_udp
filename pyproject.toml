[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightburn-udp"
version = "1.0.0"
description = "UDP communication with LightBurn software"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Urs Helfenstein", email = "uhelfenstein@users.noreply.github.com"}
]
maintainers = [
    {name = "Urs Helfenstein", email = "uhelfenstein@users.noreply.github.com"}
]
keywords = ["lightburn", "udp", "laser", "engraving", "cnc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/uhelfenstein/lightburn-udp"
Documentation = "https://github.com/uhelfenstein/lightburn-udp#readme"
Repository = "https://github.com/uhelfenstein/lightburn-udp"
"Bug Tracker" = "https://github.com/uhelfenstein/lightburn-udp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightburn_udp*"]